<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bird Table</title>
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
</head>
<body>
  <div id="app">
    <header>
      <span class="title">BIRD TABLE</span>
      <span class="dim">DEMONSTRATION SYSTEM · FICTIONAL EXERCISE</span>
      <span id="exclock" class="clock">EX GREY HERON</span>
    </header>
    <div id="map"></div>
    <div id="timeline"></div>
    <aside id="side">
      <div class="sidehead">EVENT LOG</div>
      <div id="log"></div>
      <div class="sidehead">UNIT</div>
      <div id="details"><span class="hint">Click a unit on the map to see its details.</span></div>
    </aside>
    <footer>
      <span id="grid">GRID --</span>
      <span id="zoom">ZOOM --</span>
      <span class="credit">Map data © OpenStreetMap contributors, ODbL · Natural Earth</span>
    </footer>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
